<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div id="container">
        
        <div id="header-container">
           
            
        </div>
        <div id="sidebar-container">
            
        </div>
        <div id="project-container">
            
             

               
            
        </div>
    </div> 

    <dialog id="new-project-dialog">
        <form id="new-project-form">
            <label for="project-name">Project Name:</label>
            <input type="text" id="project-name" name="projectName" placeholder="Example Project">
            <label for="project-description">Project Description:</label>
            <input type="text" id="project-description" name="projectDescription" placeholder="This is a description.">
            <div class="project-form-buttons">
                <button id = "submit-project-button" type="submit">Add Project</button>
                <button id="cancel-project-button" commandfor="new-project-dialog" command="close">Cancel</button>
            </div>
        </form>
    </dialog>

</body>
</html>
