<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div id="container">
        
        <div id="header-container">
            <h1 id="title">To-Do-List</h1>
            <h1 id="item-counter">x Items</h1>
            <button id="toggle">Dark Mode</button>
            
        </div>
        <div id="sidebar-container">
            <button id="project-overview">Project Overview</button>
            <button id="example" class="project-button">example1</button>
            <button id="taskOneID" class="task-button">task1</button>
            <button id="taskTwoID" class="task-button">task2</button>
            <button id="example-one" class="project-button">example2</button>
            
        </div>
        <div id="project-container" class="list-view">
            
             <h1 id="project-title">Work</h1>

                <div class="item-card high-priority">
                    <div class="item-group">
                        <h2 class="item-specific-name">Code review</h2>
                        <p class="item-date">May 1st</p>
                        <p class="item-priority high-priority">high</p>
                    </div>
                    <p class="item-description">Review pull requests</p>
                    <button class="completed-button">completed</button>
                </div>

                <div class="item-card low-priority">
                    <div class="item-group">
                        <h2 class="item-specific-name">Team Meeting</h2>
                        <p class="item-date">May 2nd</p>
                        <p class="item-priority low-priority">low</p>
                    </div>
                    <p class="item-description">Weekly Sync</p>
                    <button class="completed-button">completed</button>
                </div>   
            
        </div>
    </div> 
</body>
</html>
