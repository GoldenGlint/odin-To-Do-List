<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <div id="header-container">
            <h1 id="title">To-Do-List</h1>
            <h1 id="project-counter">x Projects</h1>
            <button id="toggle">Dark Mode</button>
        </div>
        <div id="sidebar-container">
            <div id="main-buttons-container">
                <button id="inbox">Inbox</button>
                <button id="today">Today</button>
                <button id="week">This Week</button>
            </div>
            <div id="projects">
                <button id="project-overview">Project Overview</button>
                <button id="example" class="project-button">example1</button>
                <button id="example-one" class="project-button">example2</button>
            </div>
        </div>
        <div id="project-container">
            <div class="project-card">
                <h2 class="project-name">Work</h2>
                <p class="project-description">Work related tasks</p>
                <p class="project-counter">2 items</p>
                <ul class="project-items">
                    <li class="item-name">Code review</li>
                    <li class="item-name">Team meeting</li>
                </ul>
            </div>

        </div>
    </div>
</body>
</html>
